name: Isolated review withdrawal probe
run-name: "Withdrawal probe ${{ inputs.operation }} PR ${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Isolated test phase
        type: choice
        options: [setup, withdraw, rerequest-withdraw, request, readonly]
        default: readonly
        required: true
      pr_number:
        description: Bot-authored sandbox PR number (zero for setup)
        type: number
        default: 0
        required: true

permissions: {}

concurrency:
  group: isolated-review-withdrawal-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'honganlxh/pccl-review-sandbox' && github.actor == 'honganlxh'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Capture review-request API behavior
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          reviewer = 'honganlxh'
          assert repository == 'honganlxh/pccl-review-sandbox'
          operation = os.environ['OPERATION']
          assert operation in {'setup', 'withdraw', 'rerequest-withdraw', 'request', 'readonly'}

          def emit(record):
              print(json.dumps(record, ensure_ascii=True), flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('```json\n' + json.dumps(record, indent=2) + '\n```\n\n')

          def api(method, path, payload=None, allow_failure=False):
              assert path.startswith('/') and not path.startswith('//')
              command = ['gh', 'api', '--include', '--method', method,
                         f'repos/{repository}{path}', '-H', 'Accept: application/vnd.github+json']
              if payload is not None:
                  command += ['--input', '-']
              result = subprocess.run(command, input=json.dumps(payload) if payload is not None else None,
                                      capture_output=True, text=True, timeout=60)
              raw = result.stdout.replace('\r\n', '\n')
              headers, separator, body = raw.partition('\n\n')
              match = re.search(r'^HTTP/\S+ (\d+)', headers)
              if not match or not separator:
                  raise RuntimeError('Missing HTTP response; exit=' + str(result.returncode))
              status = int(match[1])
              value = json.loads(body) if body.strip() else None
              selected = {}
              for line in headers.splitlines()[1:]:
                  key, _, header_value = line.partition(':')
                  if key.lower() in {'x-github-request-id', 'x-accepted-github-permissions', 'x-ratelimit-remaining'}:
                      selected[key.lower()] = header_value.strip()
              record = {'method': method, 'path': path, 'status': status, 'headers': selected}
              if payload and 'reviewers' in payload:
                  record['reviewers'] = payload['reviewers']
              if status >= 400:
                  record['response'] = value
              emit(record)
              if (result.returncode or status >= 400) and not allow_failure:
                  raise RuntimeError(f'{method} {path} returned {status}')
              return value

          def snapshot(number, phase):
              pr = api('GET', f'/pulls/{number}')
              reviews = api('GET', f'/pulls/{number}/reviews?per_page=100')
              timeline = api('GET', f'/issues/{number}/timeline?per_page=100')
              emit({'phase': phase, 'pr': number, 'url': pr['html_url'], 'author': pr['user']['login'],
                    'state': pr['state'], 'head': pr['head']['sha'],
                    'pending': [user['login'] for user in pr['requested_reviewers']],
                    'reviews': [{'author': item['user']['login'], 'state': item['state'],
                                 'commit_id': item['commit_id']} for item in reviews],
                    'events': [{'event': item['event'], 'actor': (item.get('actor') or {}).get('login'),
                                'reviewer': (item.get('requested_reviewer') or {}).get('login')}
                               for item in timeline if item['event'] in {'review_requested', 'review_request_removed'}]})
              return pr

          if operation == 'setup':
              base = api('GET', '/git/ref/heads/main')['object']['sha']
              branch = 'probe/review-withdrawal-' + os.environ['GITHUB_RUN_ID']
              api('POST', '/git/refs', {'ref': 'refs/heads/' + branch, 'sha': base})
              fixture = base64.b64encode(b'Isolated API probe; no product change.\n').decode()
              api('PUT', '/contents/review-withdrawal-probe.txt', {
                  'message': 'test: create isolated review-request fixture', 'branch': branch, 'content': fixture})
              pr = api('POST', '/pulls', {'title': '[Sandbox] Review withdrawal API probe', 'head': branch,
                       'base': 'main', 'body': 'Temporary isolated review-request experiment. Only honganlxh is invited. '
                       'No upstream PR or reviewers are changed. Close after collecting HTTP evidence.'})
              number = pr['number']
              emit({'created_pr': number, 'url': pr['html_url'], 'branch': branch})
          else:
              number = int(os.environ['PR_NUMBER'])
              assert number > 0

          pr = snapshot(number, 'before-' + operation)
          assert pr['base']['repo']['full_name'] == repository
          assert pr['head']['repo']['full_name'] == repository
          assert pr['head']['ref'].startswith('probe/review-withdrawal-')
          assert pr['user']['type'] == 'Bot' and pr['user']['login'] == 'github-actions[bot]'
          assert pr['title'] == '[Sandbox] Review withdrawal API probe'
          request_path = f'/pulls/{number}/requested_reviewers'
          payload = {'reviewers': [reviewer]}
          if operation == 'setup':
              api('POST', request_path, payload)
              snapshot(number, 'pending-before-delete')
              api('DELETE', request_path, payload, allow_failure=True)
              snapshot(number, 'after-pending-delete')
              api('DELETE', request_path, payload, allow_failure=True)
              snapshot(number, 'after-second-delete')
              api('POST', request_path, payload)
          elif operation == 'withdraw':
              api('DELETE', request_path, payload, allow_failure=True)
          elif operation == 'rerequest-withdraw':
              api('POST', request_path, payload)
              snapshot(number, 'rerequested-before-delete')
              api('DELETE', request_path, payload, allow_failure=True)
          elif operation == 'request':
              api('POST', request_path, payload)
          snapshot(number, 'after-' + operation)
          PY
